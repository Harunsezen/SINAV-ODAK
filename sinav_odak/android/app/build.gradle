plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// --- RELEASE İMZALAMA ---
//
// Anahtar bilgileri `android/key.properties` dosyasından okunur. Bu dosya
// ve keystore'un kendisi `android/.gitignore` ile DIŞLANMIŞTIR ve depoya
// ASLA girmez: keystore sızarsa uygulamanın kimliği çalınır ve Play'de
// güncelleme yayımlama yetkisi kaybedilir (keystore değiştirilemez).
//
// Dosya YOKSA release, debug anahtarıyla imzalanır — böylece geliştirme
// (`flutter run --release`) keystore olmayan makinelerde de çalışır.
// Bu derlemeler Play'e YÜKLENEMEZ; aşağıdaki uyarı bunu hatırlatır.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.harunsezen.sinav_odak"
    // `flutter.compileSdkVersion` DEĞİL, sabit 35: bağımlılıkların bir
    // bölümü (google_mobile_ads / AndroidX) API 35'e karşı derlenmiş
    // durumda ve daha düşük bir compileSdk "compiled against a newer
    // version" hatasıyla derlemeyi durduruyor.
    //
    // Bu yalnızca DERLEME hedefi; uygulamanın çalışma davranışını
    // `minSdk`/`targetSdk` belirliyor (21 / 34, aşağıda).
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8

        // ZORUNLU: flutter_local_notifications, java.time API'lerini
        // kullanıyor ve bunlar minSdk 26 altında yok. Desugaring olmadan
        // derleme KIRILIR (paket bunu açıkça şart koşuyor).
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.harunsezen.sinav_odak"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Bildirimler exact alarm kullanıyor; java.time desugaring de
        // minSdk 21'den itibaren destekleniyor.
        minSdk = 21

        // AdMob uygulama kimliği manifest'e BURADAN enjekte edilir.
        // Varsayılan Google TEST kimliği; production kimliği
        //   flutter build apk --release -Padmob_app_id=ca-app-pub-XXXX~YYYY
        // veya android/gradle.properties içindeki `admob_app_id` ile geçilir.
        // Kimlik koda ASLA girmez.
        manifestPlaceholders["admobAppId"] =
            (project.findProperty("admob_app_id")
                ?: "ca-app-pub-3940256099942544~3347511713")
    }

    signingConfigs {
        release {
            // Yalnızca key.properties varsa doldurulur. Alanları boş bırakıp
            // signingConfig'i yine de atamak, Gradle'ı "storeFile null"
            // hatasıyla düşürürdü.
            if (hasReleaseKeystore) {
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseKeystore
                ? signingConfigs.release
                : signingConfigs.debug

            if (!hasReleaseKeystore) {
                // SESSİZ kalmamalı: debug anahtarıyla imzalanmış bir AAB
                // Play Console'a yüklenemez ve hata ancak yükleme anında
                // görülür. Bkz. README > "Release imzalama".
                logger.warn(
                    "UYARI: android/key.properties yok — release derlemesi " +
                    "DEBUG anahtarıyla imzalanıyor. Bu çıktı Play Store'a " +
                    "YÜKLENEMEZ."
                )
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // flutter_local_notifications'ın java.time kullanımı için (yukarıdaki
    // coreLibraryDesugaringEnabled ile birlikte ZORUNLU).
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.2"
}
