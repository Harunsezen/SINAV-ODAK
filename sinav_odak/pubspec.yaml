name: sinav_odak
description: "Sınav Odak — sınava hazırlanan öğrenciler için ücretsiz çalışma takip uygulaması."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State & model ---
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # --- Veritabanı (offline-first, tek doğruluk kaynağı) ---
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  # connection.dart içinde sqlite3.tempDirectory için DOĞRUDAN kullanılıyor.
  # Transitif bağımlılığa güvenmek lint hatası + kırılgan çözümleme demek.
  sqlite3: ^2.4.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # --- Navigasyon ---
  go_router: ^14.2.7

  # --- Zaman & bildirim (duvar saati mimarisi) ---
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  flutter_foreground_task: ^8.10.4
  wakelock_plus: ^1.2.8

  # --- Reklam (Adım 6'da açılacak) ---
  # DİKKAT: Bu bağımlılık aktifken AndroidManifest.xml içinde
  # com.google.android.gms.ads.APPLICATION_ID meta-data'sı ZORUNLUDUR.
  # Yoksa uygulama AÇILIŞTA ÇÖKER (SDK ContentProvider kontrolü yapıyor).
  # google_mobile_ads: ^5.2.0

  # --- Grafik & dışa aktarma ---
  fl_chart: ^0.69.0
  csv: ^6.0.0
  share_plus: ^10.0.2

  # --- Yardımcı ---
  shared_preferences: ^2.3.2
  # intl sürümünü flutter_localizations pinliyor; caret ile sabitlemek
  # SDK yükseltmelerinde çözümlemeyi kırıyor.
  intl: any
  uuid: ^4.5.0
  collection: ^1.18.0

  # --- Firebase (Adım 6'da açılacak; google-services.json gerekiyor) ---
  # firebase_core: ^3.6.0
  # firebase_analytics: ^11.3.3
  # firebase_crashlytics: ^4.1.3
  # firebase_remote_config: ^5.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  custom_lint: ^0.6.7
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  # generate: true  # i18n v1.2'de açılacak (l10n.yaml + arb dosyalarıyla birlikte)
